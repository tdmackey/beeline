[package]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
description = "Async Rust helpers for Foursquare/Swarm OAuth and latest checkin polling."
documentation = "https://docs.rs/beeline"
edition = "2024"
homepage = "https://tdmackey.github.io/beeline/"
keywords = ["foursquare", "swarm", "oauth", "checkins"]
license = "MIT"
name = "beeline"
readme = "README.md"
repository = "https://github.com/tdmackey/beeline"
rust-version = "1.86"
version = "0.1.0"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
futures = "0.3"
hmac = "0.13"
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "net", "rt-multi-thread", "io-util", "sync"] }
